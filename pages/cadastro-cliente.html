<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cliente - Sistema Norteador</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/padrao.css" />
    <link rel="stylesheet" href="../css/formulario.css" />
  </head>
  <body>
    <div class="wrapper">
      <a href="../home.html" class="back">← Voltar</a>

      <h1 class="page-title">Cadastro de Cliente</h1>
      <p class="page-sub">Preencha seus dados para utilizar nossos serviços</p>

      <form id="formCliente">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome completo"
            required
          />
          <p id="saudacao" class="saudacao-usuario"></p>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço</label>
          <input
            type="text"
            id="endereco"
            name="endereco"
            placeholder="Rua, número, bairro, cidade"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="usuario">Nome de usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Escolha um nome de usuário"
            required
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Crie uma senha"
            required
          />
        </div>

        <div class="form-group">
          <label for="celular">Celular</label>
          <input
            type="tel"
            id="celular"
            name="celular"
            placeholder="(00) 00000-0000"
            required
          />
        </div>

        <button type="submit" class="btn">Cadastrar</button>
      </form>

      <p id="mensagem"></p>
    </div>
    <script src="../js/cadastro-cliente.js"></script>
  </body>
</html>
