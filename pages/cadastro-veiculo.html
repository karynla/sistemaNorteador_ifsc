<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Veículo - Sistema Norteador</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/padrao.css" />
    <link rel="stylesheet" href="../css/formulario.css" />
  </head>
  <body>
    <div class="wrapper">
      <a href="../home.html" class="back">← Voltar</a>

      <h1 class="page-title">Cadastro de Veículo</h1>
      <p class="page-sub">
        Informe os dados do veículo que utilizará nossos serviços
      </p>

      <form action="../php/salvar-veiculo.php" method="post" id="formVeiculo">
        <div class="form-group">
          <label for="marca">Marca</label>
          <input
            type="text"
            id="marca"
            name="marca"
            placeholder="Ex: Fiat, Volkswagen, Chevrolet"
            required
          />
        </div>

        <div class="form-group">
          <label for="modelo">Modelo</label>
          <input
            type="text"
            id="modelo"
            name="modelo"
            placeholder="Ex: Uno, Gol, Onix"
            required
          />
        </div>

        <div class="form-group">
          <label for="placa">Placa</label>
          <input
            type="text"
            id="placa"
            name="placa"
            placeholder="ABC-1234 ou ABC1D23"
            required
            maxlength="8"
          />
        </div>

        <button type="submit" class="btn">Cadastrar Veículo</button>
      </form>
    </div>
  </body>
</html>
